<!DOCTYPE html>
<html>

    <title>Đang chuyển hướng...</title>

      window.location.href = "https://fb.com/PiDentalClinic"; // Dự phòng bằng JavaScript
    </script>
  </head>
  <body>
    <p>Nếu hệ thống không tự chuyển đến Facebook, vui lòng <a href="https://fb.com/PiDentalClinic">bấm vào đây</a>.</p>
  </body>
</html>
